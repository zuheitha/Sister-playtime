<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sister Playtime - Voice Actor Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #080808; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        #ui-layer { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .vhs-text { font-size: 18px; color: rgba(255,255,255,0.6); text-shadow: 2px 2px #ff0000; }
        
        /* Mobile Controls */
        .touch-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; z-index: 20; display: flex; align-items: center; justify-content: center; }
        #joystick-knob { width: 50px; height: 50px; background: #ff0055; border-radius: 50%; box-shadow: 0 0 10px #ff0055; }
        
        /* Audio Control UI Panel */
        #voice-panel { position: absolute; bottom: 30px; right: 30px; z-index: 20; display: flex; flex-direction: column; gap: 10px; }
        .action-btn { padding: 12px 20px; background: #222; color: #ff0055; border: 2px solid #ff0055; font-weight: bold; font-size: 14px; border-radius: 5px; cursor: pointer; text-shadow: 0 0 5px #ff0055; }
        .action-btn:active { background: #ff0055; color: #fff; }
        #subtitle-box { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; font-size: 20px; color: #ffdd00; font-weight: bold; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 5px; display: none; z-index: 15; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="vhs-text">● VOICE ACTING HUB ACTIVE</div>
            <div class="vhs-text">STUDIO MODE</div>
        </div>
    </div>

    <div class="touch-zone" id="joystick-boundary"><div id="joystick-knob"></div></div>

    <!-- Live Character Voice Trigger Buttons -->
    <div id="voice-panel">
        <button class="action-btn" onclick="playVoice('intro')">🎵 PLAY INTRO SONG (Zuheitha)</button>
        <button class="action-btn" onclick="playVoice('emy_grabbed')">😭 EMY GRABBED (Zuheitha)</button>
        <button class="action-btn" onclick="playVoice('willy')">💨 WILLY THE KILLY (Zakir)</button>
        <button class="action-btn" onclick="playVoice('tape')">📼 PLAY LAST YEAR CLIP</button>
    </div>

    <div id="subtitle-box"></div>

    <script>
        // =============================================================
        // CHANGE THESE LINKS TO MATCH YOUR GITHUB REPOSITORY DIRECT PATHS
        // =============================================================
        const GITHUB_AUDIO_BASE = "https://githubusercontent.com";

        const audioFiles = {
            intro: {
                url: GITHUB_AUDIO_BASE + "zuheitha/intro_song.mp3",
                text: "Zuheitha: 'Hey it’s me Zuheitha wanna play? I’m lonely sooo it’s A YESSS!'"
            },
            emy_grabbed: {
                url: GITHUB_AUDIO_BASE + "zuheitha/emy_scared.mp3",
                text: "Zuheitha: 'Let go! Let go! Nooo...!'"
            },
            willy: {
                url: GITHUB_AUDIO_BASE + "zakir/willy_gas.mp3",
                text: "Willy the Killy: *Breathing out toxic blue gas* ... [Four eyes glowing]"
            },
            tape: {
                url: GITHUB_AUDIO_BASE + "archive/last_year_clip.mp3",
                text: "Children: 'Mommy!' | Daddy: 'D-d-d-y!' *Screaming* | Worker: 'WHYs everything so lagg-g-g-y...?'"
            }
        };

        // Real Sound Player Engine Instance
        let currentAudio = null;
        const subBox = document.getElementById('subtitle-box');

        function playVoice(key) {
            // Stop whatever voice actor line is playing currently
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            const track = audioFiles[key];
            
            // Show custom onscreen subtitle text
            subBox.style.display = "block";
            subBox.innerText = track.text;

            // Load and stream directly from your GitHub directory file link
            currentAudio = new Audio(track.url);
            
            currentAudio.play().catch(error => {
                console.log("Audio link placeholder active. Set up your real GitHub links to hear your voice tracks!");
                // Fallback indicator visual if files are not fully uploaded yet
                subBox.innerText = "[🔊 LINK READY - UPLOAD TO GITHUB TO HEAR RECORDING]\n" + track.text;
            });

            // Auto hide text box when your track finishes playing
            currentAudio.onended = () => {
                subBox.style.display = "none";
            };
        }

        // ==========================================
        // 3D Engine & Mobile Joystick Core Framework
        // ==========================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x080808, 0.12);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x0a0a14));
        const light = new THREE.PointLight(0xff0055, 2, 30);
        light.position.set(0, 3, -5);
        scene.add(light);

        // Simple Room Visualizer Mesh Setup
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x111116, wireframe: true });
        const room = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 40), wallMat);
        room.position.set(0, 4, -10);
        scene.add(room);
        camera.position.set(0, 2, 5);

        // Touch Control Data Capture Interface
        const joystick = document.getElementById('joystick-boundary');
        const knob = document.getElementById('joystick-knob');
        let moveVec = { x: 0, y: 0 };
        let activeTouch = false;

        joystick.addEventListener('touchstart', (e) => { activeTouch = true; updateJoy(e); }, {passive:false});
        window.addEventListener('touchmove', (e) => { if(activeTouch) updateJoy(e); }, {passive:false});
        window.addEventListener('touchend', () => { activeTouch = false; knob.style.transform = 'translate(0px,0px)'; moveVec = {x:0,y:0}; });

        function updateJoy(e) {
            e.preventDefault();
            const r = joystick.getBoundingClientRect();
            const dx = e.touches[0].clientX - (r.left + r.width/2);
            const dy = e.touches[0].clientY - (r.top + r.height/2);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            const ang = Math.atan2(dy, dx);
            knob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
            moveVec.x = (Math.cos(ang)*dist)/40; moveVec.y = (Math.sin(ang)*dist)/40;
        }

        function run() {
            requestAnimationFrame(run);
            camera.position.x += moveVec.x * 0.08;
            camera.position.z += moveVec.y * 0.08;
            renderer.render(scene, camera);
        }
        run();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
