<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sister Playtime - Chapter 1 Prototype</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #050505; color: #fff; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        /* Horror VHS Overlay UI */
        #ui-layer { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .vhs-text { font-size: 18px; color: rgba(255,255,255,0.6); text-shadow: 2px 2px #ff0000; animation: flicker 0.15s infinite; }
        
        /* Mobile Touch Controls */
        .touch-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; z-index: 20; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        #joystick-knob { width: 50px; height: 50px; background: rgba(255, 0, 85, 0.6); border-radius: 50%; box-shadow: 0 0 10px #ff0055; transition: transform 0.05s; }
        
        /* Interactive Tape Player Area */
        #tape-player-ui { position: absolute; bottom: 30px; right: 30px; z-index: 20; pointer-events: auto; }
        .action-btn { padding: 15px 25px; background: #990000; color: white; border: 2px solid #ff3333; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4); }
        .action-btn:active { background: #ff3333; }

        /* Subtitles Box */
        #subtitle-box { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; text-align: center; font-size: 22px; color: #ff3333; font-weight: bold; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #333; display: none; z-index: 15; text-shadow: 1px 1px 5px #000; }

        @keyframes flicker {
            0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; }
        }
    </style>
    <!-- Three.js for 3D Graphics Engine -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="vhs-text">● PLAY [SISTER PLAYTIME CO.]</div>
            <div class="vhs-text" id="clock">11:05:00 PM</div>
        </div>
        <div class="vhs-text" style="text-align: center; font-size: 14px;">ZUHE COMPANY LABS - LEVEL -1</div>
    </div>

    <!-- On-screen Mobile Joystick -->
    <div class="touch-zone" id="joystick-boundary">
        <div id="joystick-knob"></div>
    </div>

    <!-- VCR/Tape System to look at last year clip -->
    <div id="tape-player-ui">
        <button class="action-btn" id="play-tape-btn">📼 PLAY "LAST YEAR CLIP"</button>
    </div>

    <!-- Audio Captions System -->
    <div id="subtitle-box" id="subtitles"></div>

    <script>
        // Update Game Clock Layout
        setInterval(() => {
            const d = new Date();
            document.getElementById('clock').innerText = d.toLocaleTimeString();
        }, 1000);

        // ==========================================
        // 3D HORROR ENVIRONMENT (Three.js)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.15); // Dark horror atmosphere fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Ambient low dim light
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);

        // Player's Flashlight
        const flashlight = new THREE.SpotLight(0xffeedd, 5, 40, Math.PI / 6, 0.5, 1);
        flashlight.position.set(0, 2, 0);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // Create Lab Room (Walls and Floor)
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x1f1f2e, wireframe: true }); // Creepy factory look
        const roomGeo = new THREE.BoxGeometry(30, 10, 50);
        const room = new THREE.Mesh(roomGeo, wallMat);
        room.position.set(0, 5, -20);
        scene.add(room);

        // Place Emy Love Ponys (Zuheitha) Experiment Pod in the center
        const podGeo = new THREE.CylinderGeometry(2, 2, 6, 16);
        const podMat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
        const labPod = new THREE.Mesh(podGeo, podMat);
        labPod.position.set(0, 3, -15);
        scene.add(labPod);

        camera.position.set(0, 2, 5);

        // ==========================================
        // MOBILE TOUCH JOYSTICK LOGIC
        // ==========================================
        const joystick = document.getElementById('joystick-boundary');
        const knob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, y: 0 };
        let isMoving = false;

        joystick.addEventListener('touchstart', (e) => { isMoving = true; handleJoystick(e); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(isMoving) handleJoystick(e); }, {passive: false});
        window.addEventListener('touchend', () => {
            isMoving = false;
            knob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, y: 0 };
        });

        function handleJoystick(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joystick.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let deltaX = touch.clientX - centerX;
            let deltaY = touch.clientY - centerY;
            const distance = Math.min(Math.sqrt(deltaX*deltaX + deltaY*deltaY), 40); // clamp distance
            
            const angle = Math.atan2(deltaY, deltaX);
            const knobX = Math.cos(angle) * distance;
            const knobY = Math.sin(angle) * distance;
            
            knob.style.transform = `translate(${knobX}px, ${knobY}px)`;
            
            // Normalize values for movement
            moveVector.x = knobX / 40;
            moveVector.y = knobY / 40;
        }

        // ==========================================
        // SOUND EFFECTS & CINEMATIC AUDIO SYSTEM
        // ==========================================
        const subBox = document.getElementById('subtitle-box');
        
        // Synth Audio Generator to play the specific sounds without external files
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSynthTone(freq, type, duration, delay=0) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay);
        }

        // Play Intro Theme Music ("Hey it's me Zuheitha...")
        function playIntroSong() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            // Upbeat but slightly eerie melody blocks
            playSynthTone(440, 'triangle', 0.4, 0);
            playSynthTone(494, 'triangle', 0.4, 400);
            playSynthTone(523, 'triangle', 0.4, 800);
            playSynthTone(587, 'triangle', 0.6, 1200);
        }

        // Play Tape Script ("Last Year Clip")
        document.getElementById('play-tape-btn').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const script = [
                { time: 0, text: "[Tape Hissing] ... Loading Log Archive ...", sound: () => playSynthTone(100, 'sawtooth', 0.5) },
                { time: 2000, text: "Children: Mommy! Mommy!", sound: () => { playSynthTone(600, 'sine', 0.2); playSynthTone(700, 'sine', 0.2, 100); } },
                { time: 4500, text: "Daddy: D-D-D-Y...!", sound: () => playSynthTone(120, 'square', 0.4) },
                { time: 6000, text: "💥 [CRASH! KILL EFFECT SOUND]", sound: () => { playSynthTone(60, 'sawtooth', 1.5); playSynthTone(40, 'sawtooth', 1.5); } },
                { time: 8000, text: "🔊 [EVERYBODY STARTS SCREAMING AND CRYING]", sound: () => { setInterval(() => playSynthTone(Math.random()*300+200, 'sawtooth', 0.1), 100); } },
                { time: 11000, text: "Worker: 'Hey come check out sister playtim—'", sound: () => playSynthTone(300, 'triangle', 0.5) },
                { time: 13500, text: "Worker: '⚡ WHYs everything so lagg-g-g-y...?'", sound: () => { playSynthTone(200, 'square', 0.2); playSynthTone(150, 'square', 0.2, 200); playSynthTone(100, 'square', 0.4, 400); } },
                { time: 17000, text: "[🔴 TAPE CORRUPTED / END OF RECORDING]", sound: () => playSynthTone(50, 'sine', 0.5) }
              ];
// Clear interval tracker if any screaming runs forever
let screamingEffects = setTimeout(() => {}, 0);
script.forEach(line => {
setTimeout(() => {
subBox.style.display = 'block';
subBox.innerText = line.text;
line.sound();
if(line.text.includes("END OF RECORDING")) {
setTimeout(() => { subBox.style.display = 'none'; }, 2500);
}
}, line.time);
});
});
// Trigger intro theme song on first touch
window.addEventListener('touchstart', () => {
if(audioCtx.state === 'suspended') {
playIntroSong();
}
}, { once: true });
// ==========================================
// MAIN GAME RUN LOOP
// ==========================================
function gameLoop() {
requestAnimationFrame(gameLoop);
// Move player position based on mobile joystick vectors
camera.position.x += moveVector.x * 0.1;
camera.position.z += moveVector.y * 0.1;
// Anchor the flashlight to shine straight ahead of the camera view
flashlight.position.copy(camera.position);
const targetPosition = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).add(camera.position);
flashlight.target.position.copy(targetPosition);
// Slowly spin Emy's mutation pod container for background action
labPod.rotation.y += 0.01;
renderer.render(scene, camera);
}
gameLoop();
// Handle browser window scaling adjustments
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
